<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faster Rider - My Earnings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .earn-gradient { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .animate-up { animation: slideUp 0.5s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-white p-4 flex items-center shadow-sm sticky top-0 z-50">
        <i class="fas fa-arrow-left text-xl mr-4 cursor-pointer text-gray-600" onclick="history.back()"></i>
        <h1 class="font-extrabold text-lg text-gray-800">Earning Reports</h1>
    </header>

    <main class="flex-1 p-5 max-w-md mx-auto w-full">
        
        <div class="earn-gradient rounded-[2.5rem] p-8 text-white shadow-2xl mb-8 relative overflow-hidden animate-up">
            <div class="relative z-10">
                <p class="text-[10px] opacity-80 uppercase tracking-[0.2em] font-black mb-1">Lifetime Commission</p>
                <h2 id="totalEarning" class="text-5xl font-extrabold mb-6 tracking-tighter">Rs. 0</h2>
                
                <div class="grid grid-cols-2 gap-4 border-t border-white/20 pt-5">
                    <div>
                        <p class="text-[9px] opacity-70 uppercase font-bold">Total Orders</p>
                        <p id="totalOrdersCount" class="text-xl font-black">0</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[9px] opacity-70 uppercase font-bold">Status</p>
                        <p class="text-xs font-black bg-white/20 inline-block px-2 py-1 rounded-lg">Top Performer</p>
                    </div>
                </div>
            </div>
            <i class="fas fa-coins absolute -right-8 -top-8 text-white/10 text-[12rem] rotate-12"></i>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-white p-5 rounded-[2rem] shadow-sm border border-gray-100 animate-up" style="animation-delay: 0.1s;">
                <div class="w-10 h-10 bg-orange-50 rounded-2xl flex items-center justify-center text-orange-500 mb-3">
                    <i class="fas fa-calendar-day"></i>
                </div>
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-tighter">Today</p>
                <p id="todayEarning" class="text-xl font-black text-gray-800">Rs. 0</p>
            </div>
            
            <div class="bg-white p-5 rounded-[2rem] shadow-sm border border-gray-100 animate-up" style="animation-delay: 0.2s;">
                <div class="w-10 h-10 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-500 mb-3">
                    <i class="fas fa-calendar-week"></i>
                </div>
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-tighter">Weekly</p>
                <p id="weeklyEarning" class="text-xl font-black text-gray-800">Rs. 0</p>
            </div>
        </div>

        <div class="space-y-4 mb-10 animate-up" style="animation-delay: 0.3s;">
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-500 text-xl">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <div>
                        <h4 class="font-black text-gray-800 text-xs uppercase">Monthly Earning</h4>
                        <p class="text-[10px] text-gray-400 font-bold">Current Month Stats</p>
                    </div>
                </div>
                <p id="monthlyEarning" class="text-xl font-black text-emerald-600">Rs. 0</p>
            </div>
        </div>

        <div class="text-center p-6 bg-gray-100 rounded-[2rem] border border-dashed border-gray-300">
            <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Commission Policy</p>
            <p class="text-[9px] text-gray-400 mt-1">Earning is calculated based on fixed commission per completed order defined in app settings.</p>
        </div>

    </main>

    <script>
        const SB_URL = "https://hkabhikizdlbavfkualt.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        const riderPhone = (localStorage.getItem('rider_phone') || "").trim();

        async function initEarnings() {
            if (!riderPhone) return;
            calculateEarnings(); // Initial load

            // Realtime listener to update earnings live
            _supabase.channel('live-earnings')
                .on('postgres_changes', { 
                    event: 'UPDATE', 
                    schema: 'public', 
                    table: 'orders',
                    filter: `rider_phone=eq.${riderPhone}` 
                }, (payload) => {
                    // Agar order complete hua hai toh earnings dobara calculate kare
                    if (payload.new.status === 'completed') {
                        calculateEarnings();
                    }
                })
                .subscribe();
        }

        async function calculateEarnings() {
            try {
                // 1. Get Commission from settings
                const { data: settings } = await _supabase.from('app_settings').select('rider_commission').eq('id', 1).single();
                const commRate = parseFloat(settings?.rider_commission || 0);

                // 2. Get All Completed Orders
                const { data: orders, error } = await _supabase
                    .from('orders')
                    .select('created_at')
                    .eq('rider_phone', riderPhone)
                    .eq('status', 'completed');

                if (error) throw error;

                // Dates Logic
                const now = new Date();
                const todayStr = now.toISOString().split('T')[0];
                
                const startOfWeek = new Date();
                startOfWeek.setDate(now.getDate() - 7);
                
                const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);

                let todayE = 0, weeklyE = 0, monthlyE = 0, totalE = 0;

                orders.forEach(o => {
                    const oDate = new Date(o.created_at);
                    const oDateStr = o.created_at.split('T')[0];

                    // Lifetime
                    totalE += commRate;

                    // Today
                    if (oDateStr === todayStr) todayE += commRate;

                    // Weekly
                    if (oDate >= startOfWeek) weeklyE += commRate;

                    // Monthly
                    if (oDate >= startOfMonth) monthlyE += commRate;
                });

                // Update UI
                document.getElementById('totalEarning').innerText = `Rs. ${totalE.toLocaleString()}`;
                document.getElementById('totalOrdersCount').innerText = orders.length;
                document.getElementById('todayEarning').innerText = `Rs. ${todayE}`;
                document.getElementById('weeklyEarning').innerText = `Rs. ${weeklyE}`;
                document.getElementById('monthlyEarning').innerText = `Rs. ${monthlyE}`;

            } catch (err) {
                console.error(err);
            }
        }

        window.onload = initEarnings;
    </script>
</body>
</html>
