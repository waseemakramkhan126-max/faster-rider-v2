<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>Faster Rider - Customer Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; height: 100dvh; }
        .chat-bg { background-color: #e5ddd5; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-attachment: fixed; }
        .bubble-in, .bubble-out { max-width: 85%; word-wrap: break-word; overflow-wrap: break-word; word-break: break-all; }
        .bubble-in { background: white; border-radius: 0 15px 15px 15px; align-self: flex-start; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .bubble-out { background: #dcf8c6; border-radius: 15px 0 15px 15px; align-self: flex-end; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; transition: all 0.3s ease; }
        .status-online { background-color: #4ade80; box-shadow: 0 0 5px #4ade80; }
        .status-active { background-color: #ef4444; animation: pulse-red 1s infinite; box-shadow: 0 0 8px #ef4444; }

        @keyframes pulse-red { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
        .mic-active { background-color: #ef4444 !important; animation: pulse-red 1s infinite; }
        #chatBox {
         scroll-behavior: smooth;
          overflow-y: auto;
         flex: 1 1 0%;
         }
        .animate-pop { animation: pop 0.2s ease-out; }
        @keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .tick-blue { color: #34b7f1; }
        audio { filter: sepia(20%) saturate(70%) grayscale(1) contrast(90%); }
    </style>
</head>
<body class="fixed inset-0 flex flex-col overflow-hidden bg-[#e5ddd5]">

    <header class="bg-[#075e54] p-4 text-white flex items-center shadow-md shrink-0 z-10">
        <i class="fas fa-arrow-left mr-4 cursor-pointer text-lg" onclick="history.back()"></i>
        <div class="flex-1">
            <h1 id="headerTitle" class="font-bold text-sm uppercase tracking-tight">Customer Chat</h1>
            <p class="text-[10px] opacity-80 flex items-center gap-1">
                <span id="statusDot" class="status-dot status-online"></span>
                <span id="statusText">Online</span>
            </p>
        </div>
    </header>

    <main id="chatBox" class="flex-1 chat-bg p-4 flex flex-col gap-3 overflow-y-auto min-h-0 w-full" style="background-color: #e5ddd5; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-attachment: fixed; background-blend-mode: overlay;"></main>

    <footer class="bg-white p-2 flex items-center gap-2 border-t shrink-0 z-20 w-full sticky bottom-0">
        <button onclick="document.getElementById('fileInp').click()" class="text-gray-500 text-xl px-2">
            <i class="fas fa-camera"></i>
        </button>
        <input type="file" id="fileInp" class="hidden" accept="image/*" onchange="uploadFile(this)">

        <div class="flex-1 bg-gray-100 rounded-2xl flex items-center px-4 min-w-0">
            <textarea id="msgInp" oninput="toggleButtons(); autoHeight(this)" placeholder="Type a message" rows="1" class="w-full bg-transparent py-2 outline-none text-sm resize-none" style="height: 36px; max-height: 100px;"></textarea>
        </div>

        <div id="btnContainer" class="flex items-center justify-center w-10 h-10 shrink-0">
            <button id="sendBtn" onclick="sendMsg('text')" class="hidden bg-[#128c7e] text-white w-full h-full rounded-full flex items-center justify-center">
                <i class="fas fa-paper-plane text-sm ml-0.5"></i>
            </button>
            <button id="voiceBtn" onclick="handleVoice()" class="bg-[#128c7e] text-white w-full h-full rounded-full flex items-center justify-center transition-all">
                <i class="fas fa-microphone" id="micIcon"></i>
            </button>
        </div>
    </footer>

    <script>
        // Some restrictive WebViews (and browsers without cross-origin
        // isolation headers) don't expose SharedArrayBuffer at all, which
        // makes ffmpeg.wasm throw even when using the single-threaded core
        // (which doesn't actually need real shared memory). This polyfill
        // just satisfies the existence check.
        if (typeof SharedArrayBuffer === 'undefined') {
            window.SharedArrayBuffer = ArrayBuffer;
        }

        const SB_URL = "https://hkabhikizdlbavfkualt.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');
        const riderPhone = localStorage.getItem('rider_phone') || 'Rider';

        let mediaRecorder;
        let audioChunks = [];

        // ffmpeg.wasm — single-threaded core, converts whatever raw format
        // the device records (usually webm, which WhatsApp rejects) into a
        // proper MP3 (audio/mpeg), which WhatsApp officially supports.
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ log: false });
        let ffmpegLoaded = false;

        // Mobile keyboard khulne/band hone par footer ko sahi jagah rakhta hai
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                const footer = document.querySelector('footer');
                const offset = window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop;
                footer.style.transform = `translateY(-${offset > 0 ? offset : 0}px)`;
            });
        }

        function autoHeight(el) {
            el.style.height = '36px';
            el.style.height = Math.min(el.scrollHeight, 100) + 'px';
        }

        function toggleButtons() {
            const val = document.getElementById('msgInp').value.trim();
            document.getElementById('sendBtn').classList.toggle('hidden', val === "");
            document.getElementById('voiceBtn').classList.toggle('hidden', val !== "");
        }

        function renderBubble(m) {
            const isMe = m.sender_phone === riderPhone;
            const time = m.created_at ? new Date(m.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Just now';

            let mediaHtml = '';
            if (m.type === 'image' && m.file_url) {
                mediaHtml = `<img src="${m.file_url}" class="rounded-lg mb-1 max-h-60 w-full object-cover shadow-sm" onclick="window.open('${m.file_url}')">`;
            } else if (m.type === 'voice' && m.file_url) {
                mediaHtml = `<div class="bg-black/5 p-1 rounded-md mb-1"><audio controls src="${m.file_url}" class="h-8 w-44"></audio></div>`;
            } else if (m.type === 'video' && m.file_url) {
                mediaHtml = `<video controls src="${m.file_url}" class="rounded-lg mb-1 max-h-60 w-full"></video>`;
            } else if (m.type === 'document' && m.file_url) {
                mediaHtml = `<a href="${m.file_url}" target="_blank" class="flex items-center gap-2 bg-black/5 p-2 rounded-md mb-1 text-sm text-blue-700"><i class="fas fa-file"></i> Document Dekhein</a>`;
            }

            return `
                <div class="${isMe ? 'bubble-out' : 'bubble-in'} p-2 px-3 animate-pop shadow-sm mb-1">
                    ${mediaHtml}
                    ${m.message ? `<p class="text-[14px] leading-tight text-gray-800 whitespace-pre-wrap">${m.message}</p>` : ''}
                    <div class="text-[9px] text-gray-500 text-right mt-1 flex items-center justify-end">
                        ${time} ${isMe ? (m.status === 'seen' ? '<i class="fas fa-check-double tick-blue ml-1"></i>' : '<i class="fas fa-check ml-1"></i>') : ''}
                    </div>
                </div>
            `;
        }

        async function loadMessages() {
            if(!orderId) return;
            const { data } = await _supabase.from('order_chats').select('*').eq('order_id', orderId).order('created_at', { ascending: true });
            if(data) {
                const chatBox = document.getElementById('chatBox');
                chatBox.innerHTML = data.map(m => renderBubble(m)).join('');
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        async function sendMsg(type, content = '', fUrl = null) {
            const msgInp = document.getElementById('msgInp');
            const msgText = content || msgInp.value.trim();
            if(!msgText && !fUrl) return;

            const tempMsg = { sender_phone: riderPhone, message: msgText, type: type, file_url: fUrl, status: 'sending' };
            document.getElementById('chatBox').innerHTML += renderBubble(tempMsg);
            document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;

            msgInp.value = '';
            msgInp.style.height = '36px';
            toggleButtons();

            try {
                await _supabase.from('order_chats').insert([{
                    order_id: orderId, sender_phone: riderPhone, message: msgText, type: type, file_url: fUrl, status: 'sent'
                }]);
            } catch (err) {
                console.error("Failed to send:", err);
            }
        }

        async function uploadFile(input) {
            const file = input.files[0];
            if(!file) return;
            const name = `orders/img_${Date.now()}.jpg`;
            const { data, error } = await _supabase.storage.from('order-files').upload(name, file);
            if(data) {
                const { data: urlData } = _supabase.storage.from('order-files').getPublicUrl(name);
                sendMsg('image', '', urlData.publicUrl);
            }
        }

        async function handleVoice() {
            const micBtn = document.getElementById('voiceBtn');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    // Record in whatever format the device actually produces —
                    // it gets converted to MP3 below regardless of raw format.
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        statusText.innerText = "Converting...";
                        const rawBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });

                        try {
                            if (!ffmpegLoaded) {
                                await ffmpeg.load({
                                    corePath: 'https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js'
                                });
                                ffmpegLoaded = true;
                            }

                            ffmpeg.FS('writeFile', 'input.webm', await fetchFile(rawBlob));
                            await ffmpeg.run('-i', 'input.webm', '-vn', '-ar', '44100', '-ac', '1', '-b:a', '64k', 'output.mp3');
                            const outData = ffmpeg.FS('readFile', 'output.mp3');
                            const mp3Blob = new Blob([outData.buffer], { type: 'audio/mpeg' });

                            const name = `orders/voice_r_${Date.now()}.mp3`;
                            const { data } = await _supabase.storage.from('order-files').upload(name, mp3Blob);
                            if (data) {
                                const { data: urlData } = _supabase.storage.from('order-files').getPublicUrl(name);
                                sendMsg('voice', '', urlData.publicUrl);
                            }
                        } catch (convErr) {
                            console.error("Audio conversion failed:", convErr);
                            alert("Convert Error: " + (convErr.message || convErr.toString()));
                        } finally {
                            statusDot.classList.replace('status-active', 'status-online');
                            statusText.innerText = "Online";
                        }
                    };

                    mediaRecorder.start();
                    micBtn.classList.add('mic-active');
                    statusDot.classList.replace('status-online', 'status-active');
                    statusText.innerText = "Recording...";
                } catch (e) { document.getElementById('chatAlertModal').classList.remove('hidden'); }
            } else {
                mediaRecorder.stop();
                micBtn.classList.remove('mic-active');
                statusText.innerText = "Converting...";
            }
        }

        _supabase.channel('rider-chat')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'order_chats', filter: `order_id=eq.${orderId}` }, () => {
                loadMessages();
            }).subscribe();

        async function getOrderInfo() {
            const { data } = await _supabase.from('orders').select('customer_name').eq('id', orderId).single();
            if(data) document.getElementById('headerTitle').innerText = data.customer_name;
        }

        getOrderInfo();
        loadMessages();
    </script>
<div id="chatAlertModal" class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center p-4 hidden z-[999] transition-all duration-300">
    <div class="bg-slate-900/90 border border-white/10 rounded-[2.5rem] p-6 w-full max-w-xs text-center shadow-2xl backdrop-blur-xl">
        <div class="w-16 h-16 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center text-2xl mx-auto mb-4 border border-red-500/20">
            <i class="fas fa-microphone-slash"></i>
        </div>
        <h3 class="text-lg font-black text-white mb-2 tracking-wide">Mic Access Denied</h3>
        <p class="text-[11px] text-slate-400 mb-6 leading-relaxed">Please allow microphone permission from your browser settings to record audio.</p>
        <button onclick="document.getElementById('chatAlertModal').classList.add('hidden')" class="w-full py-3 bg-gradient-to-r from-orange-500 to-red-600 active:scale-95 rounded-2xl font-black text-[10px] uppercase tracking-widest text-white shadow-lg shadow-orange-500/20 transition-all">
            OK
        </button>
    </div>
</div>
</body>
</html>
