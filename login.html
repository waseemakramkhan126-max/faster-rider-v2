<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Login - Faster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        input:focus { border-color: #f97316 !important; outline: none; }
        
        /* Logo Animation */
        #riderAppLogo { transition: 0.5s ease-in-out; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-md glass rounded-[2.5rem] p-8 shadow-2xl">
        <div class="text-center mb-10">
            <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-xl border-4 border-orange-500 overflow-hidden">
                <img id="riderAppLogo" src="" class="w-full h-full object-cover hidden">
                <i id="fallbackIcon" class="fas fa-motorcycle text-orange-500 text-3xl"></i>
            </div>
            <h1 class="text-2xl font-black text-white uppercase tracking-tight">Rider Login</h1>
            <p class="text-slate-400 text-sm font-semibold">Enter your credentials to start</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div class="space-y-2">
                <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-4">Rider ID</label>
                <div class="relative">
                    <i class="fas fa-user-tag absolute left-5 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="text" id="riderId" required
                        class="w-full bg-slate-800/50 border border-slate-700 text-white rounded-2xl py-4 pl-12 pr-4 transition-all"
                        placeholder="e.g. RIDER001">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-4">Phone Number</label>
                <div class="relative">
                    <i class="fas fa-phone absolute left-5 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="tel" id="riderPhone" required
                        class="w-full bg-slate-800/50 border border-slate-700 text-white rounded-2xl py-4 pl-12 pr-4 transition-all"
                        placeholder="e.g. 03001234567">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-4">Password</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-5 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="password" id="password" required
                        class="w-full bg-slate-800/50 border border-slate-700 text-white rounded-2xl py-4 pl-12 pr-4 transition-all"
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="loginBtn"
                class="w-full bg-orange-500 hover:bg-orange-600 text-slate-900 font-black py-4 rounded-2xl shadow-xl shadow-orange-500/20 uppercase tracking-widest text-sm transition-all active:scale-95 flex items-center justify-center gap-2">
                <span>Login Now</span>
                <i class="fas fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div id="errorMessage" class="mt-6 text-center text-red-400 text-xs font-bold hidden">
            <i class="fas fa-exclamation-circle mr-1"></i> Invalid ID, Phone or Password
        </div>
    </div>

    <script>
        const SB_URL = "https://hkabhikizdlbavfkualt.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        // --- Logo Fetching Logic ---
        async function fetchAppBranding() {
            try {
                const { data } = await _supabase
                    .from('app_settings')
                    .select('logo_url')
                    .eq('id', 1)
                    .single();

                if (data && data.logo_url) {
                    const logoImg = document.getElementById('riderAppLogo');
                    const fallback = document.getElementById('fallbackIcon');
                    logoImg.src = data.logo_url;
                    logoImg.classList.remove('hidden');
                    fallback.classList.add('hidden');
                }
            } catch (err) {
                console.error("Logo fetch error:", err);
            }
        }

        // Run branding on load
        window.onload = fetchAppBranding;

        if (localStorage.getItem('riderData')) {
            window.location.href = 'index.html';
        }

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMessage');

        loginForm.onsubmit = async (e) => {
            e.preventDefault();
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = `<i class="fas fa-circle-notch animate-spin"></i> Verifying...`;
            errorMsg.classList.add('hidden');

            const rId = document.getElementById('riderId').value.trim();
            const rPhone = document.getElementById('riderPhone').value.trim();
            const pass = document.getElementById('password').value.trim();

            try {
                const { data, error } = await _supabase
                    .from('riders')
                    .select('*')
                    .eq('rider_id', rId)
                    .eq('phone', rPhone)
                    .eq('password', pass)
                    .maybeSingle();

                if (error) throw error;

                if (!data) {
                    errorMsg.innerText = "Invalid ID, Phone or Password. Check your details.";
                    errorMsg.classList.remove('hidden');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = `<span>Login Now</span> <i class="fas fa-arrow-right text-xs"></i>`;
                    return;
                }

                localStorage.setItem('riderData', JSON.stringify(data));
                localStorage.setItem('rider_phone', data.phone);
                window.location.href = 'index.html';

            } catch (err) {
                errorMsg.innerText = "Connection Error. Please try again.";
                errorMsg.classList.remove('hidden');
                loginBtn.disabled = false;
                loginBtn.innerHTML = `<span>Login Now</span> <i class="fas fa-arrow-right text-xs"></i>`;
            }
        };
    </script>
</body>
</html>
