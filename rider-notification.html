<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faster Rider - Notification Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #0f172a; 
            color: white; 
            overflow-x: hidden; 
        }
        .glass-card { 
            background: rgba(30, 41, 59, 0.4); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255,255,255,0.06); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pulse-orange { animation: pulse-ring 2s infinite; }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
        .animate-slide-in { animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#0f172a]">

    <audio id="notificationSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-500.wav" preload="auto"></audio>

    <header class="p-4 flex items-center justify-between border-b border-white/5 bg-[#0f172a]/80 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <button onclick="location.href='index.html'" class="text-orange-500 w-10 h-10 bg-white/5 hover:bg-white/10 rounded-2xl flex items-center justify-center transition-all">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div>
                <h1 class="font-black uppercase text-xs tracking-widest text-orange-500">Notification Center</h1>
                <p class="text-[10px] text-slate-400 font-bold tracking-wide" id="connectionStatus">Connecting...</p>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-green-500/10 border border-green-500/20 px-3 py-1.5 rounded-full">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            <span class="text-[9px] font-black tracking-wider text-green-500 uppercase">Live</span>
        </div>
    </header>

    <div id="debugLog" class="p-2 bg-black/50 text-[9px] text-yellow-400 font-mono max-h-24 overflow-y-auto hidden"></div>

    <main class="flex-1 p-4 space-y-4 max-w-md mx-auto w-full" id="notificationFeed">
        <div id="initialLoader" class="text-center py-20 opacity-30 animate-pulse">
            <i class="fas fa-satellite-dish text-3xl text-orange-500 mb-3 block"></i>
            <p class="text-xs font-black uppercase tracking-widest">Listening for alerts...</p>
        </div>
    </main>

    <script>
        const SB_URL = "https://hkabhikizdlbavfkualt.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U";
        
        // Explicitly global initializing window supabase client
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        const feedContainer = document.getElementById('notificationFeed');
        const loader = document.getElementById('initialLoader');
        const connStatus = document.getElementById('connectionStatus');
        const debugDiv = document.getElementById('debugLog');

        function showDebug(msg) {
            debugDiv.classList.remove('hidden');
            debugDiv.innerHTML += `> ${msg}<br>`;
        }

        function playAlert() {
            const sound = document.getElementById('notificationSound');
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio play deferred:", e));
            }
        }

        function checkLoader() {
            if (loader && loader.parentNode) {
                loader.remove();
            }
        }

        function addAdminNotification(data) {
            checkLoader();
            const timeStr = data.created_at ? new Date(data.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Just Now';
            
            const card = document.createElement('div');
            card.className = "glass-card p-5 rounded-[2.2rem] flex flex-col gap-3 border-l-4 border-l-cyan-500 animate-slide-in shadow-xl";
            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 bg-cyan-500/10 text-cyan-400 rounded-full flex items-center justify-center text-sm">
                            <i class="fas fa-user-shield"></i>
                        </div>
                        <div>
                            <h3 class="font-black text-xs uppercase tracking-wider text-cyan-400">Admin Broadcast</h3>
                            <p class="text-[9px] text-slate-500 font-semibold">${timeStr}</p>
                        </div>
                    </div>
                </div>
                <div class="bg-white/5 p-4 rounded-2xl border border-white/5">
                    <h4 class="font-bold text-sm text-white mb-1 tracking-tight">${data.title || 'Notification'}</h4>
                    <p class="text-[11px] text-slate-300 font-medium leading-relaxed">${data.message || data.body || 'No Content'}</p>
                </div>
            `;
            feedContainer.insertBefore(card, feedContainer.firstChild);
        }

        function addOrderNotification(order, isNew = true) {
            checkLoader();
            const timeStr = order.created_at ? new Date(order.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Just Now';
            const orderIdStr = order.id ? order.id.toString().slice(-4) : '0000';

            const card = document.createElement('div');
            card.className = "glass-card p-5 rounded-[2.2rem] flex flex-col gap-3 border-l-4 border-l-orange-500 animate-slide-in shadow-xl";
            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 bg-orange-500/10 text-orange-500 rounded-full flex items-center justify-center text-xs font-black pulse-orange">
                            #${orderIdStr}
                        </div>
                        <div>
                            <h3 class="font-black text-xs uppercase tracking-wider text-orange-500">${isNew ? 'New Order Alert!' : 'Pending Order'}</h3>
                            <p class="text-[9px] text-slate-500 font-semibold">${timeStr}</p>
                        </div>
                    </div>
                </div>
                <div class="bg-white/5 p-3 rounded-2xl flex flex-col gap-2 border border-white/5">
                    <div class="flex items-center justify-between">
                        <span class="text-[10px] text-slate-400 font-bold">Customer:</span>
                        <span class="text-[11px] font-black text-white capitalize">${order.customer_name || 'Guest'}</span>
                    </div>
                    <div class="flex items-start gap-2 pt-1 border-t border-white/5">
                        <i class="fas fa-map-marker-alt text-red-500 text-xs mt-0.5"></i>
                        <p class="text-[11px] text-slate-300 font-semibold line-clamp-2">${order.delivery_address || 'No Address Provided'}</p>
                    </div>
                </div>
                <button onclick="location.href='pending-orders.html'" class="w-full py-3 bg-gradient-to-r from-orange-500 to-amber-500 text-slate-950 font-black text-[10px] uppercase tracking-widest rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                    <span>View Order</span>
                    <i class="fas fa-arrow-right text-[9px]"></i>
                </button>
            `;
            feedContainer.insertBefore(card, feedContainer.firstChild);
        }

        async function loadInitialData() {
            try {
                connStatus.innerText = "Fetching Database...";
                showDebug("Starting database synchronization...");

                // 1. Load Admin Notifications
                const resNotifications = await _supabase.from('notifications').select('*').limit(5);
                if (resNotifications.error) {
                    showDebug(`Notification Error: ${resNotifications.error.message}`);
                } else {
                    showDebug(`Loaded ${resNotifications.data.length} notifications`);
                    if(resNotifications.data.length > 0) checkLoader();
                    resNotifications.data.forEach(item => addAdminNotification(item));
                }

                // 2. Load Pending Orders
                const resOrders = await _supabase.from('orders').select('*').limit(5);
                if (resOrders.error) {
                    showDebug(`Orders Error: ${resOrders.error.message}`);
                } else {
                    showDebug(`Loaded Total ${resOrders.data.length} orders from DB`);
                    
                    // Filter down rows locally to prevent lowercase 'pending' strict mismatches
                    const pendingOrders = resOrders.data.filter(o => String(o.status).toLowerCase().trim() === 'pending');
                    showDebug(`Filtered ${pendingOrders.length} matching 'pending' status orders.`);

                    if (pendingOrders.length > 0) {
                        checkLoader();
                        pendingOrders.forEach(order => addOrderNotification(order, false));
                    }
                }

                // Close loader if everything runs smoothly but database is totally empty
                connStatus.innerText = "Realtime System Active";
                setTimeout(() => {
                    if(document.getElementById('initialLoader')) {
                        checkLoader();
                        feedContainer.innerHTML = `<div class="text-center py-12 opacity-40"><p class="text-xs font-bold uppercase tracking-widest">No Alerts Found in DB</p></div>`;
                    }
                }, 1500);

            } catch (err) {
                showDebug(`Global Crash: ${err.message}`);
                connStatus.innerText = "Connection Failed";
            }
        }

        function initRealtimeListeners() {
            _supabase.channel('public-notifications')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications' }, payload => {
                    if (payload.new) { addAdminNotification(payload.new); playAlert(); }
                }).subscribe();

            _supabase.channel('public-orders')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, payload => {
                    if (payload.new && String(payload.new.status).toLowerCase().trim() === 'pending') { 
                        addOrderNotification(payload.new, true); 
                        playAlert(); 
                    }
                }).subscribe();
        }

        window.onload = () => {
            loadInitialData();
            initRealtimeListeners();
        };
    </script>
</body>
</html>
