<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faster Rider - Notification Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css\">\n    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #0f172a; 
            color: white; 
            overflow-x: hidden; 
        }
        
        .glass-card { 
            background: rgba(30, 41, 59, 0.4); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255,255,255,0.06); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .glass-card:hover {
            transform: translateY(-2px);
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(255,255,255,0.1);
        }

        .pulse-orange {
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }

        .animate-slide-in {
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#0f172a]">

    <audio id="notificationSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-500.wav" preload="auto"></audio>

    <header class="p-4 flex items-center justify-between border-b border-white/5 bg-[#0f172a]/80 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <button onclick="location.href='index.html'" class="text-orange-500 w-10 h-10 bg-white/5 hover:bg-white/10 rounded-2xl flex items-center justify-center transition-all">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div>
                <h1 class="font-black uppercase text-xs tracking-widest text-orange-500">Notification Center</h1>
                <p class="text-[10px] text-slate-400 font-bold tracking-wide">Realtime System Active</p>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-green-500/10 border border-green-500/20 px-3 py-1.5 rounded-full">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            <span class="text-[9px] font-black tracking-wider text-green-500 uppercase">Live</span>
        </div>
    </header>

    <main class="flex-1 p-4 space-y-4 max-w-md mx-auto w-full" id="notificationFeed">
        <div id="initialLoader" class="text-center py-20 opacity-30 animate-pulse">
            <i class="fas fa-satellite-dish text-3xl text-orange-500 mb-3 block"></i>
            <p class="text-xs font-black uppercase tracking-widest">Listening for alerts...</p>
        </div>
    </main>

    <script>
        const SB_URL = "https://hkabhikizdlbavfkualt.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        const feedContainer = document.getElementById('notificationFeed');
        const loader = document.getElementById('initialLoader');
        let totalAlerts = 0;

        // Sound Trigger Function with User Interaction Handling Protection
        function playAlert() {
            const sound = document.getElementById('notificationSound');
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio autoplay protected until first interaction:", e));
            }
        }

        // Helper to remove loading state on first item
        function checkLoader() {
            if (loader && loader.parentNode) {
                loader.remove();
            }
        }

        // 1. Function to inject Admin Notification Cards
        function addAdminNotification(data) {
            checkLoader();
            playAlert();
            
            const timeStr = new Date(data.created_at || new Date()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            const card = document.createElement('div');
            card.className = "glass-card p-5 rounded-[2.2rem] flex flex-col gap-3 border-l-4 border-l-cyan-500 animate-slide-in shadow-xl";
            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 bg-cyan-500/10 text-cyan-400 rounded-full flex items-center justify-center text-sm shadow-inner">
                            <i class="fas fa-user-shield"></i>
                        </div>
                        <div>
                            <h3 class="font-black text-xs uppercase tracking-wider text-cyan-400">Message From Admin</h3>
                            <p class="text-[9px] text-slate-500 font-semibold">${timeStr}</p>
                        </div>
                    </div>
                    <span class="text-[8px] bg-cyan-500/20 text-cyan-400 font-black px-2 py-0.5 rounded-full uppercase tracking-widest">Broadcast</span>
                </div>
                <div class="bg-white/5 p-4 rounded-2xl border border-white/5">
                    <h4 class="font-bold text-sm text-white mb-1 tracking-tight">${data.title || 'Important Update'}</h4>
                    <p class="text-[11px] text-slate-300 font-medium leading-relaxed">${data.message || data.body || ''}</p>
                </div>
            `;
            
            feedContainer.insertBefore(card, feedContainer.firstChild);
        }

        // 2. Function to inject Pending Order Notification Cards
        function addOrderNotification(order, isNew = true) {
            checkLoader();
            playAlert();

            const timeStr = new Date(order.created_at || new Date()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            const card = document.createElement('div');
            card.className = "glass-card p-5 rounded-[2.2rem] flex flex-col gap-3 border-l-4 border-l-orange-500 animate-slide-in shadow-xl";
            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 bg-orange-500/10 text-orange-500 rounded-full flex items-center justify-center text-xs font-black pulse-orange">
                            #${order.id.toString().slice(-4)}
                        </div>
                        <div>
                            <h3 class="font-black text-xs uppercase tracking-wider text-orange-500">${isNew ? 'New Order Available!' : 'Pending Alert'}</h3>
                            <p class="text-[9px] text-slate-500 font-semibold">${timeStr}</p>
                        </div>
                    </div>
                    <span class="text-[8px] bg-orange-500/20 text-orange-500 font-black px-2 py-0.5 rounded-full uppercase tracking-widest animate-pulse">Pending</span>
                </div>
                
                <div class="bg-white/5 p-3 rounded-2xl flex flex-col gap-2 border border-white/5">
                    <div class="flex items-center justify-between">
                        <span class="text-[10px] text-slate-400 font-bold">Customer:</span>
                        <span class="text-[11px] font-black text-white capitalize">${order.customer_name || 'Guest User'}</span>
                    </div>
                    <div class="flex items-start gap-2 pt-1 border-t border-white/5">
                        <i class="fas fa-map-marker-alt text-red-500 text-xs mt-0.5"></i>
                        <p class="text-[11px] text-slate-300 font-semibold leading-normal line-clamp-2">${order.delivery_address || 'Address not provided'}</p>
                    </div>
                </div>

                <button onclick="location.href='pending-orders.html'" class="w-full py-3 bg-gradient-to-r from-orange-500 to-amber-500 active:scale-95 text-slate-950 font-black text-[10px] uppercase tracking-widest rounded-xl shadow-lg shadow-orange-500/10 hover:shadow-orange-500/20 transition-all flex items-center justify-center gap-2">
                    <span>View & Accept Order</span>
                    <i class="fas fa-arrow-right text-[9px]"></i>
                </button>
            `;

            feedContainer.insertBefore(card, feedContainer.firstChild);
        }

        // 3. Realtime Listener setup
        function initRealtimeListeners() {
            // Monitor Orders Table for Pending entries
            _supabase.channel('notification-orders')
                .on('postgres_changes', { 
                    event: 'INSERT', 
                    schema: 'public', 
                    table: 'orders'
                }, (payload) => {
                    if (payload.new && payload.new.status === 'pending') {
                        addOrderNotification(payload.new, true);
                    }
                })
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'orders'
                }, (payload) => {
                    // Agar koi order update hokar wapis pending hua ho
                    if (payload.new && payload.new.status === 'pending' && payload.old.status !== 'pending') {
                        addOrderNotification(payload.new, false);
                    }
                })
                .subscribe();

            // Monitor Notifications/Admin Messages Table
            // (Hum generic 'notifications' table sun rhe hain jahan admin panel data push karega)
            _supabase.channel('notification-admin')
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'notifications' // Admin broadcast messages table
                }, (payload) => {
                    if (payload.new) {
                        addAdminNotification(payload.new);
                    }
                })
                .subscribe();
        }

        // Fetch existing pending orders on startup to show current state
        async function loadExistingPending() {
    try {
        console.log("Supabase se orders fetch ho rahe hain...");
        
        const { data, error } = await _supabase
            .from('orders')
            .select('*')
            .eq('status', 'pending')
            .order('created_at', { ascending: true })
            .limit(5);

        // Yeh aapko exact data ya error mobile console/inspect mein dikhayega
        console.log("Supabase Response:", { data, error }); 

        if (error) {
            console.error("Supabase Query Error:", error.message);
            checkLoader();
            return;
        }

        checkLoader(); // Kisi bhi haal mein loader ko ab hat jana chahiye

        if (data && data.length > 0) {
            data.forEach(order => {
                addOrderNotification(order, false);
            });
        } else {
            // Agar koi order pending nahi mila
            feedContainer.innerHTML = `
                <div class="text-center py-20 opacity-40 animate-slide-in">
                    <i class="fas fa-box-open text-3xl text-slate-500 mb-3 block"></i>
                    <p class="text-xs font-black uppercase tracking-widest">No Active Orders Found</p>
                </div>
            `;
        }
    } catch (err) {
        console.error("Startup fetch execution error:", err);
        checkLoader();
    }
}
        // Initialize App
        window.onload = () => {
            loadExistingPending();
            initRealtimeListeners();
            
            // Interaction trigger fallback for sound activation
            document.body.addEventListener('click', () => {
                const sound = document.getElementById('notificationSound');
                if(sound) { sound.load(); }
            }, { once: true });
        };
    </script>
</body>
</html>
