<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faster - Available Orders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: white; margin: 0; padding: 0; }
        
        /* Order Card Styling */
        .order-card { 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.05); 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        .order-card:active { transform: scale(0.97); background: rgba(30, 41, 59, 0.9); }
        
        /* Modal Styling */
        #detailsModal { 
            position: fixed; inset: 0; z-index: 1000; 
            background: rgba(0,0,0,0.9); 
            display: none; 
            align-items: flex-end; 
        }
        #detailsModal.active { display: flex; }

        .modal-content { 
            width: 100%; height: 94vh; background: #0b141a; 
            border-radius: 2.5rem 2.5rem 0 0; display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.1, 0.7, 0.3, 1);
        }
        #detailsModal.active .modal-content { transform: translateY(0); }

        .chat-bg {
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-color: #0b141a; background-blend-mode: overlay; background-attachment: fixed;
        }

        .bubble { 
            background: #202c33; padding: 12px; border-radius: 0 15px 15px 15px; 
            max-width: 85%; position: relative; border: 1px solid rgba(255,255,255,0.05);
        }
        audio { height: 35px; }
    </style>
</head>
<body class="p-0">

    <header class="p-4 flex items-center justify-between sticky top-0 bg-[#0f172a]/90 backdrop-blur-md z-50 border-b border-white/5">
        <div class="flex items-center gap-4">
            <button onclick="location.href='index.html'" class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-orange-500">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 class="text-sm font-black uppercase tracking-widest text-orange-500">Available Jobs</h1>
        </div>
        <img src="https://hfaghazbwdbjurachzzq.supabase.co/storage/v1/object/public/order-files/img_1771546661816.jpg" class="w-9 h-9 rounded-full border border-white/10 shadow-lg">
    </header>

    <main id="ordersList" class="p-4 space-y-4">
        <div class="py-20 text-center opacity-20 text-[10px] font-black uppercase tracking-[0.4em]">Scanning for Orders...</div>
    </main>

    <div id="detailsModal">
        <div class="modal-content overflow-hidden">
            <div class="bg-[#202c33] p-4 flex items-center gap-3 border-b border-white/5">
                <button onclick="closeModal()" class="w-10 h-10 flex items-center justify-center text-slate-400">
                    <i class="fas fa-chevron-down text-xl"></i>
                </button>
                <div id="modalAvatar" class="w-11 h-11 bg-orange-500 rounded-full flex items-center justify-center font-black text-slate-900 text-lg shadow-lg">?</div>
                <div class="flex-1 overflow-hidden">
                    <h2 id="modalName" class="font-bold text-white text-base truncate capitalize tracking-tight">Name</h2>
                    <p id="modalAddr" class="text-[10px] text-slate-400 font-bold truncate flex items-center gap-1">
                        <i class="fas fa-map-marker-alt text-red-500"></i> Address...
                    </p>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-5 space-y-5 chat-bg">
                <div id="modalChatBody" class="space-y-4"></div>
            </div>

            <div class="p-6 bg-[#202c33] border-t border-white/5">
                <button id="mainAcceptBtn" class="w-full bg-green-600 active:bg-green-500 text-white font-black py-4 rounded-2xl shadow-xl uppercase tracking-widest text-xs transition-all">
                    Confirm & Accept Order
                </button>
            </div>
        </div>
    </div>

    <script>
    const SB_URL = "https://hkabhikizdlbavfkualt.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U";
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    
    const rider = JSON.parse(localStorage.getItem('riderData'));
    let currentOrders = [];
    let isModalOpen = false;

    async function fetchOrders() {
        if (isModalOpen) return;
        const { data, error } = await _supabase.from('orders').select('*').eq('status', 'pending').order('created_at', { ascending: false });
        if (!error && data) {
            currentOrders = data;
            updateOrderList(data);
        }
    }

    function updateOrderList(orders) {
        const list = document.getElementById('ordersList');
        if (orders.length === 0) {
            list.innerHTML = `<div class="text-center py-20 opacity-20 font-black uppercase text-xs">No active orders</div>`;
            return;
        }
        list.innerHTML = orders.map(o => `
            <div onclick="openOrderPreview('${o.id}')" class="order-card p-5 rounded-[2.2rem] flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-orange-500/20 text-orange-500 rounded-full flex items-center justify-center font-black text-xs">
                            #${o.id.toString().slice(-4)}
                        </div>
                        <h3 class="font-black text-sm capitalize tracking-tight text-white">${o.customer_name || 'New Order'}</h3>
                    </div>
                    <i class="fas fa-chevron-right text-slate-700 text-xs"></i>
                </div>
                <div class="flex items-start gap-2 bg-white/5 p-3 rounded-2xl">
                    <i class="fas fa-map-marker-alt text-red-500 mt-1 text-xs"></i>
                    <p class="text-[11px] text-slate-300 font-semibold leading-relaxed line-clamp-2">
                        ${o.delivery_address || 'Address not provided'}
                    </p>
                </div>
            </div>
        `).join('');
    }

    function openOrderPreview(id) {
        const order = currentOrders.find(o => String(o.id) === String(id));
        if (!order) return;

        isModalOpen = true;
        document.getElementById('modalName').innerText = order.customer_name || 'Guest User';
        document.getElementById('modalAddr').innerText = order.delivery_address || 'Location not specified';
        document.getElementById('modalAvatar').innerText = (order.customer_name || 'C').charAt(0).toUpperCase();

        let contentHTML = '';
        const details = order.order_details || order.text_content;
        if(details) contentHTML += `<div class="bubble text-white text-sm shadow-sm">${details}</div>`;
        if(order.voice_url) contentHTML += `<div class="bubble shadow-sm"><audio controls class="w-full"><source src="${order.voice_url}" type="audio/mpeg"></audio></div>`;
        if(order.image_url) contentHTML += `<div class="bubble p-1 shadow-sm"><img src="${order.image_url}" class="rounded-xl w-full h-auto border border-white/5" onclick="window.open(this.src)"></div>`;

        document.getElementById('modalChatBody').innerHTML = contentHTML;
        document.getElementById('mainAcceptBtn').onclick = () => acceptThisOrder(order.id);

        const modal = document.getElementById('detailsModal');
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('active'), 10);
    }

    function closeModal() {
        const modal = document.getElementById('detailsModal');
        modal.classList.remove('active');
        setTimeout(() => {
            modal.style.display = 'none';
            isModalOpen = false;
        }, 400);
    }
let redirectUrl = "";

    // Custom Alert Show karne ka function (Updated)
    function showCustomAlert(title, message, isSuccess = false, targetUrl = "") {
        document.getElementById('alertTitle').innerText = title;
        document.getElementById('alertMessage').innerText = message;
        redirectUrl = targetUrl;
        
        const icon = document.getElementById('alertIcon');
        if(isSuccess) {
            icon.className = "w-16 h-16 bg-green-500/10 text-green-500 rounded-full flex items-center justify-center text-2xl mx-auto mb-4 border border-green-500/20";
            icon.innerHTML = '<i class="fas fa-check-circle"></i>';
        } else {
            icon.className = "w-16 h-16 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center text-2xl mx-auto mb-4 border border-red-500/20";
            icon.innerHTML = '<i class="fas fa-exclamation-circle"></i>';
        }
        document.getElementById('customAlertModal').classList.remove('hidden');
    }

    // Modal close karne par agle page par order ID k sath bhejega
    function closeAlertModal() {
        document.getElementById('customAlertModal').classList.add('hidden');
        if(redirectUrl) {
            location.href = redirectUrl;
        }
    }

    // Updated accept order function bina kisi alert() ke
    async function acceptThisOrder(orderId) {
        const btn = document.getElementById('mainAcceptBtn');
        const riderData = JSON.parse(localStorage.getItem('riderData'));
        
        const rPhone = riderData ? (riderData.phone || riderData.rider_phone) : null;
        const rId = riderData ? riderData.rider_id : null;

        if (!rPhone) {
            showCustomAlert("Error", "Rider phone not found! Please Login again.", false);
            return;
        }

        btn.disabled = true;
        btn.innerHTML = `<i class="fas fa-circle-notch animate-spin"></i> Processing...`;

        try {
            const { error } = await _supabase
                .from('orders')
                .update({ 
                    status: 'assigned', 
                    rider_phone: rPhone, 
                    rider_id: rId,
                    rider_status: 'Accepted',
                    assigned_at: new Date().toISOString() 
                })
                .eq('id', orderId)
                .eq('status', 'pending');

            if (error) throw error;

            // Background button ko wapas normal karein
            btn.innerHTML = "Confirm & Accept Order";
            btn.disabled = false;

            // Success Popup dikhayega aur OK dabaane par ID k sath redirection hogi
            showCustomAlert("Success", "Order Accepted Successfully!", true, `order-details.html?id=${orderId}`);

        } catch (err) {
            showCustomAlert("Error", "Could not accept order: " + err.message, false);
            btn.disabled = false;
            btn.innerHTML = "Confirm & Accept Order";
        }
    }
    fetchOrders(); // Initial load
    
    // Realtime listener for new pending orders
    _supabase.channel('live-pending-orders')
        .on('postgres_changes', { 
            event: '*', 
            schema: 'public', 
            table: 'orders',
            filter: 'status=eq.pending' // Sirf pending orders ke changes sune
        }, (payload) => {
            console.log("Pending order update:", payload);
            fetchOrders(); // Jab naya order aaye ya status change ho, list refresh kare
        })
        .subscribe();
</script>
<div id="customAlertModal" class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center p-4 hidden z-[999] transition-all duration-300">
    <div class="bg-slate-900/90 border border-white/10 rounded-[2.5rem] p-6 w-full max-w-xs text-center shadow-2xl backdrop-blur-xl">
        <div id="alertIcon" class="w-16 h-16 bg-orange-500/10 text-orange-500 rounded-full flex items-center justify-center text-2xl mx-auto mb-4 border border-orange-500/20">
            <i class="fas fa-info-circle"></i>
        </div>
        <h3 id="alertTitle" class="text-lg font-black text-white mb-2 tracking-wide">Notification</h3>
        <p id="alertMessage" class="text-[11px] text-slate-400 mb-6 leading-relaxed"></p>
        <button onclick="closeAlertModal()" class="w-full py-3 bg-gradient-to-r from-orange-500 to-red-600 active:scale-95 rounded-2xl font-black text-[10px] uppercase tracking-widest text-white shadow-lg shadow-orange-500/20 transition-all">
            OK
        </button>
    </div>
</div>
</body>
</html>
