<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faster - Available Orders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: white; margin: 0; padding: 0; }
        
        /* Order Card Styling */
        .order-card { 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.05); 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        .order-card:active { transform: scale(0.97); background: rgba(30, 41, 59, 0.9); }
        
        /* Modal Styling */
        #detailsModal { 
            position: fixed; inset: 0; z-index: 1000; 
            background: rgba(0,0,0,0.9); 
            display: none; 
            align-items: flex-end; 
        }
        #detailsModal.active { display: flex; }

        .modal-content { 
            width: 100%; height: 94vh; background: #0b141a; 
            border-radius: 2.5rem 2.5rem 0 0; display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.1, 0.7, 0.3, 1);
        }
        #detailsModal.active .modal-content { transform: translateY(0); }

        .chat-bg {
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-color: #0b141a; background-blend-mode: overlay; background-attachment: fixed;
        }

        .bubble { 
            background: #202c33; padding: 12px; border-radius: 0 15px 15px 15px; 
            max-width: 85%; position: relative; border: 1px solid rgba(255,255,255,0.05);
        }
        audio { height: 35px; }
    </style>
</head>
<body class="p-0">

    <header class="p-4 flex items-center justify-between sticky top-0 bg-[#0f172a]/90 backdrop-blur-md z-50 border-b border-white/5">
        <div class="flex items-center gap-4">
            <button onclick="location.href='index.html'" class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-orange-500">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 class="text-sm font-black uppercase tracking-widest text-orange-500">Available Jobs</h1>
        </div>
        <img src="https://hfaghazbwdbjurachzzq.supabase.co/storage/v1/object/public/order-files/img_1771546661816.jpg" class="w-9 h-9 rounded-full border border-white/10 shadow-lg">
    </header>

    <main id="ordersList" class="p-4 space-y-4">
        <div class="py-20 text-center opacity-20 text-[10px] font-black uppercase tracking-[0.4em]">Scanning for Orders...</div>
    </main>

    <div id="detailsModal">
        <div class="modal-content overflow-hidden">
            <div class="bg-[#202c33] p-4 flex items-center gap-3 border-b border-white/5">
                <button onclick="closeModal()" class="w-10 h-10 flex items-center justify-center text-slate-400">
                    <i class="fas fa-chevron-down text-xl"></i>
                </button>
                <div id="modalAvatar" class="w-11 h-11 bg-orange-500 rounded-full flex items-center justify-center font-black text-slate-900 text-lg shadow-lg">?</div>
                <div class="flex-1 overflow-hidden">
                    <h2 id="modalName" class="font-bold text-white text-base truncate capitalize tracking-tight">Name</h2>
                    <p id="modalAddr" class="text-[10px] text-slate-400 font-bold truncate flex items-center gap-1">
                        <i class="fas fa-map-marker-alt text-red-500"></i> Address...
                    </p>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-5 space-y-5 chat-bg">
                <div id="modalChatBody" class="space-y-4"></div>
            </div>

            <div class="p-6 bg-[#202c33] border-t border-white/5">
                <button id="mainAcceptBtn" class="w-full bg-green-600 active:bg-green-500 text-white font-black py-4 rounded-2xl shadow-xl uppercase tracking-widest text-xs transition-all">
                    Confirm & Accept Order
                </button>
            </div>
        </div>
    </div>

    <script>
    const SB_URL = "https://hkabhikizdlbavfkualt.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U";
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    
    const rider = JSON.parse(localStorage.getItem('riderData'));
    let currentOrders = [];
    let isModalOpen = false;

    async function fetchOrders() {
    if (isModalOpen) return;
    
    const listContainer = document.getElementById('ordersList');
    
    // 1. Yahan se data uthayen (Sirf ek baar)
    const riderData = JSON.parse(localStorage.getItem('riderData'));
    const riderArea = localStorage.getItem('rider_area') || ""; 
    const riderId = riderData ? riderData.rider_id : null;

    // Console mein check karein ke data sahi uth raha hai
    console.log("Checking Fetch Data:", { riderArea, riderId });

    try {
        // 2. Query run karein
        // Note: Agar riderArea khali hua toh query error de sakti hai, isliye hum ensure kar rahe hain
        const { data, error } = await _supabase
            .from('orders')
            .select('*')
            .eq('status', 'pending')
            .or(`area.ilike.${riderArea},rider_id.eq.${riderId}`) 
            .order('created_at', { ascending: false });
            
        if (error) {
            console.error("Supabase Error:", error);
            return;
        }

        console.log("Database Data:", data);

        if (data && data.length > 0) {
            currentOrders = data;
            updateOrderList(data);
        } else {
            if (listContainer) listContainer.innerHTML = `<p class="text-center py-20 opacity-20">No active orders</p>`;
        }
    } catch (e) {
        console.error("Crash Error:", e);
    }
}
    function updateOrderList(orders) {
        // ID safe handling
        const list = document.getElementById('ordersList') || document.getElementById('list');
        if (!list) return;
        
        if (orders.length === 0) {
            list.innerHTML = `<div class="text-center py-20 opacity-20 font-black uppercase text-xs tracking-widest">No active orders</div>`;
            return;
        }
        
        list.innerHTML = orders.map(o => `
            <div onclick="openOrderPreview('${o.id}')" class="order-card p-5 rounded-[2.2rem] flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-orange-500/20 text-orange-500 rounded-full flex items-center justify-center font-black text-xs">
                            #${o.id.toString().slice(-4)}
                        </div>
                        <h3 class="font-black text-sm capitalize tracking-tight text-white">${o.customer_name || 'New Order'}</h3>
                    </div>
                    <i class="fas fa-chevron-right text-slate-700 text-xs"></i>
                </div>
                <div class="flex items-start gap-2 bg-white/5 p-3 rounded-2xl">
                    <i class="fas fa-map-marker-alt text-red-500 mt-1 text-xs"></i>
                    <p class="text-[11px] text-slate-300 font-semibold leading-relaxed line-clamp-2">
                        ${o.delivery_address || 'Address not provided'}
                    </p>
                </div>
            </div>
        `).join('');
    }

    function openOrderPreview(id) {
        try {
            const order = currentOrders.find(o => String(o.id) === String(id));
            if (!order) return;

            isModalOpen = true;
            
            const elName = document.getElementById('modalName');
            const elAddr = document.getElementById('modalAddr');
            const elAvatar = document.getElementById('modalAvatar');
            const elChatBody = document.getElementById('modalChatBody');
            const acceptBtn = document.getElementById('mainAcceptBtn');
            const detailsModal = document.getElementById('detailsModal');

            if (elName) elName.innerText = order.customer_name || 'Guest User';
            if (elAddr) elAddr.innerText = order.delivery_address || 'Location not specified';
            if (elAvatar) elAvatar.innerText = (order.customer_name || 'C').charAt(0).toUpperCase();

            let contentHTML = '';
            let detailsArray = [];
            
            if (order.order_details) {
                if (Array.isArray(order.order_details)) {
                    detailsArray = order.order_details;
                } else if (typeof order.order_details === 'string') {
                    try {
                        if (order.order_details.trim().startsWith('[')) {
                            detailsArray = JSON.parse(order.order_details);
                        } else {
                            detailsArray = [{ type: 'text', value: order.order_details }];
                        }
                    } catch (e) {
                        detailsArray = [{ type: 'text', value: order.order_details }];
                    }
                } else {
                    detailsArray = [{ type: 'text', value: String(order.order_details) }];
                }
            }

            if (detailsArray.length === 0) {
                contentHTML = `<div class="bubble text-[11px] font-bold text-slate-400">No instructions available.</div>`;
            } else {
                detailsArray.forEach(item => {
                    if (item && item.type === 'text') {
                        contentHTML += `
                            <div class="bubble text-[11px] font-bold text-white leading-relaxed">
                                ${item.value || ''}
                            </div>`;
                    } else if (item && item.type === 'voice') {
                        contentHTML += `
                            <div class="bubble w-full max-w-[260px]">
                                <audio controls class="w-full opacity-80" src="${item.value || ''}"></audio>
                            </div>`;
                    } else if (item && item.value) {
                        contentHTML += `
                            <div class="bubble text-[11px] font-bold text-white leading-relaxed">
                                ${item.value}
                            </div>`;
                    } else if (typeof item === 'string') {
                        contentHTML += `
                            <div class="bubble text-[11px] font-bold text-white leading-relaxed">
                                ${item}
                            </div>`;
                    }
                });
            }

            if (elChatBody) elChatBody.innerHTML = contentHTML;

            if (acceptBtn) {
                acceptBtn.onclick = function() {
                    acceptThisOrder(order.id);
                };
            }

            if (detailsModal) {
                detailsModal.classList.add('active');
            }
        } catch (err) {
            console.error("Error in openOrderPreview:", err);
        }
    }

    function closeModal() {
        const detailsModal = document.getElementById('detailsModal');
        if (detailsModal) detailsModal.classList.remove('active');
        setTimeout(() => {
            isModalOpen = false;
            fetchOrders();
        }, 400);
    }

    async function acceptThisOrder(orderId) {
        if (!orderId) {
            showCustomAlert("Error", "Invalid Order ID!", false);
            return;
        }

        const btn = document.getElementById('mainAcceptBtn');
        if (!btn) return;

        const riderData = JSON.parse(localStorage.getItem('riderData'));
        const rPhone = riderData ? (riderData.phone || riderData.rider_phone) : null;
        const rId = riderData ? riderData.rider_id : null;

        if (!rPhone) {
            showCustomAlert("Error", "Rider phone not found! Please Login again.", false);
            return;
        }

        btn.disabled = true;
        btn.innerHTML = `<i class="fas fa-circle-notch animate-spin"></i> Processing...`;

        try {
            const { error } = await _supabase
                .from('orders')
                .update({ 
                    status: 'assigned', 
                    rider_phone: rPhone, 
                    rider_id: rId,
                    rider_status: 'Accepted',
                    assigned_at: new Date().toISOString() 
                })
                .eq('id', orderId)
                .eq('status', 'pending');

            if (error) throw error;

            showCustomAlert("Success", "Order Accepted Successfully!", true);
            
            setTimeout(() => {
                location.href = `order-details.html?id=${orderId}`;
            }, 1200);

        } catch (err) {
            console.error("Error accepting order:", err);
            showCustomAlert("Error", "Could not accept order: " + err.message, false);
            btn.disabled = false;
            btn.innerHTML = "Confirm & Accept Order";
        }
    }

    function showCustomAlert(title, message, isSuccess) {
        const alertTitle = document.getElementById('alertTitle');
        const alertMessage = document.getElementById('alertMessage');
        const iconDiv = document.getElementById('alertIcon');
        const customAlertModal = document.getElementById('customAlertModal');

        if (alertTitle) alertTitle.innerText = title;
        if (alertMessage) alertMessage.innerText = message;
        
        if (iconDiv) {
            if (isSuccess) {
                iconDiv.className = "w-16 h-16 bg-green-500/10 text-green-500 rounded-full flex items-center justify-center text-2xl mx-auto mb-4 border border-green-500/20";
                iconDiv.innerHTML = `<i class="fas fa-check-circle"></i>`;
            } else {
                iconDiv.className = "w-16 h-16 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center text-2xl mx-auto mb-4 border border-red-500/20";
                iconDiv.innerHTML = `<i class="fas fa-times-circle"></i>`;
            }
        }
        
        if (customAlertModal) customAlertModal.classList.remove('hidden');
    }

    function closeAlertModal() {
        const customAlertModal = document.getElementById('customAlertModal');
        if (customAlertModal) customAlertModal.classList.add('hidden');
    }

    // Initial load
    fetchOrders();

    // Clean Realtime listener
    _supabase.channel('live-pending-orders')
        .on('postgres_changes', { 
            event: '*', 
            schema: 'public', 
            table: 'orders',
            filter: 'status=eq.pending'
        }, (payload) => {
            console.log("Pending order update:", payload);
            fetchOrders();
        })
        .subscribe();
</script>
<div id="customAlertModal" class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center p-4 hidden z-[999] transition-all duration-300">
    <div class="bg-slate-900/90 border border-white/10 rounded-[2.5rem] p-6 w-full max-w-xs text-center shadow-2xl backdrop-blur-xl">
        <div id="alertIcon" class="w-16 h-16 bg-orange-500/10 text-orange-500 rounded-full flex items-center justify-center text-2xl mx-auto mb-4 border border-orange-500/20">
            <i class="fas fa-info-circle"></i>
        </div>
        <h3 id="alertTitle" class="text-lg font-black text-white mb-2 tracking-wide">Notification</h3>
        <p id="alertMessage" class="text-[11px] text-slate-400 mb-6 leading-relaxed"></p>
        <button onclick="closeAlertModal()" class="w-full py-3 bg-gradient-to-r from-orange-500 to-red-600 active:scale-95 rounded-2xl font-black text-[10px] uppercase tracking-widest text-white shadow-lg shadow-orange-500/20 transition-all">
            OK
        </button>
    </div>
</div>
</body>
</html>
