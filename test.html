<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faster Rider - Financial Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .rider-card { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); transition: 0.3s; }
        .ledger-card { transition: transform 0.2s; border-left: 4px solid #e2e8f0; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-white p-4 flex items-center shadow-sm sticky top-0 z-50">
        <i class="fas fa-arrow-left text-xl mr-4 cursor-pointer text-gray-600" onclick="history.back()"></i>
        <h1 class="font-extrabold text-lg text-gray-800">Financial Ledger</h1>
    </header>

    <main class="flex-1 p-5 max-w-md mx-auto w-full">
        <div id="balanceCard" class="rider-card rounded-[2.5rem] p-8 text-white shadow-2xl mb-6 relative overflow-hidden">
            <div class="relative z-10">
                <p id="balanceLabel" class="text-[10px] opacity-60 uppercase tracking-[0.2em] font-black mb-1">Net Office Balance</p>
                <h2 id="balanceAmount" class="text-5xl font-extrabold mb-4 tracking-tighter">Rs. 0</h2>
                <div id="statusBadge" class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest bg-white/10 border border-white/20 text-white/80">
                    Syncing Ledger...
                </div>
            </div>
            <i class="fas fa-file-invoice-dollar absolute -right-8 -bottom-8 text-white/5 text-[10rem] -rotate-12"></i>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm text-center">
                <p class="text-[9px] font-bold text-gray-400 uppercase tracking-tighter mb-1">Cash Collected</p>
                <p id="totalCollected" class="text-lg font-black text-green-600">Rs. 0</p>
            </div>
            <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm text-center">
                <p class="text-[9px] font-bold text-gray-400 uppercase tracking-tighter mb-1">My Total Haqq</p>
                <p id="totalRiderDue" class="text-lg font-black text-blue-600">Rs. 0</p>
            </div>
        </div>

        <h3 class="font-black text-gray-800 uppercase text-[10px] tracking-widest mb-4 px-2 text-center">Orders Pending Settlement</h3>

        <div id="transactionList" class="space-y-4 pb-10">
            <div class="flex justify-center py-10">
                <i class="fas fa-circle-notch animate-spin text-3xl text-slate-900"></i>
            </div>
        </div>
    </main>

    <script>
        const SB_URL = "https://hfaghazbwdbjurachzzq.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmYWdoYXpid2RianVyYWNoenpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4ODQ1ODAsImV4cCI6MjA4NjQ2MDU4MH0.ojmtP9i_wO74CuvDUgI--lhocsfqcB_Lql_hC2w8UMI";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        const riderPhone = (localStorage.getItem('rider_phone') || "").trim();

        async function initWallet() {
            if (!riderPhone) {
                alert("❌ Rider phone not found! Please login again.");
                return;
            }
            fetchLedger();

            // Realtime update jab bhi order table change ho
            _supabase.channel('custom-all-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, fetchLedger)
            .subscribe();
        }

        async function fetchLedger() {
            try {
                // Sirf wo orders uthayein jo delivered hain lekin settle nahi huye
                const { data, error } = await _supabase
                    .from('orders')
                    .select('*')
                    .eq('rider_phone', riderPhone)
                    .eq('is_settled', false)
                    .eq('status', 'completed');

                if (error) throw error;

                let globalCollected = 0;
                let globalRiderDue = 0;
                let listHtml = "";

                if (data.length === 0) {
                    document.getElementById('transactionList').innerHTML = `<p class="text-center py-10 text-gray-400 text-xs font-bold">ALL CLEAR! ✅<br>No Pending Settlements</p>`;
                    updateUI(0);
                    return;
                }

                data.forEach(o => {
                    const itemPrice = parseFloat(o.item_price || 0);
                    const riderComm = parseFloat(o.delivery_charges || 0);
                    const collected = parseFloat(o.final_amount || 0);

                    const riderHaqq = itemPrice + riderComm;
                    const netToOffice = collected - riderHaqq;

                    globalCollected += collected;
                    globalRiderDue += riderHaqq;

                    listHtml += `
                        <div class="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm ledger-card">
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <p class="text-[10px] font-black text-gray-400 uppercase">Order #${o.id.toString().slice(-5)}</p>
                                    <p class="text-xs font-bold text-slate-800">${o.customer_name || 'Customer'}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[10px] font-black uppercase text-gray-400">Net Office</p>
                                    <p class="text-sm font-black ${netToOffice >= 0 ? 'text-red-600' : 'text-green-600'}">
                                        Rs. ${Math.abs(netToOffice)}
                                    </p>
                                </div>
                            </div>
                            <div class="flex justify-between text-[10px] font-bold text-slate-500 border-t pt-2">
                                <span>Recv: Rs. ${collected}</span>
                                <span>Investment+Comm: Rs. ${riderHaqq}</span>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('transactionList').innerHTML = listHtml;
                document.getElementById('totalCollected').innerText = `Rs. ${globalCollected}`;
                document.getElementById('totalRiderDue').innerText = `Rs. ${globalRiderDue}`;
                
                const finalNet = globalCollected - globalRiderDue;
                updateUI(finalNet);

            } catch (err) {
                console.error(err);
                alert("⚠️ LEDGER ERROR: " + err.message);
            }
        }

        function updateUI(balance) {
            const amtEl = document.getElementById('balanceAmount');
            const badge = document.getElementById('statusBadge');
            const label = document.getElementById('balanceLabel');
            const card = document.getElementById('balanceCard');

            amtEl.innerText = `Rs. ${Math.abs(balance).toLocaleString()}`;

            if (balance > 0) {
                badge.innerText = "Cash in Hand (Office Debt)";
                label.innerText = "Submit to Office";
                card.className = "rider-card rounded-[2.5rem] p-8 text-white shadow-2xl mb-6 relative overflow-hidden bg-gradient-to-br from-red-900 to-slate-900";
            } else if (balance < 0) {
                badge.innerText = "Office owes you money";
                label.innerText = "Collect from Office";
                card.className = "rider-card rounded-[2.5rem] p-8 text-white shadow-2xl mb-6 relative overflow-hidden bg-gradient-to-br from-green-800 to-slate-900";
            } else {
                badge.innerText = "All Settlements Clear";
                label.innerText = "Net Balance";
                card.className = "rider-card rounded-[2.5rem] p-8 text-white shadow-2xl mb-6 relative overflow-hidden bg-slate-900";
            }
        }

        window.onload = initWallet;
    </script>
</body>
</html>
