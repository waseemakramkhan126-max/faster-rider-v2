<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faster - Order Processing</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b141a; color: white; margin:0; }
.chat-bg { background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-color: #0b141a; background-blend-mode: overlay; }

/* WhatsApp UI Tweaks */
.bubble-left { background: #dcf8c6; color: #000; padding: 12px; border-radius: 0 15px 15px 15px; max-width: 85%; align-self: flex-start; margin-bottom: 12px; font-size: 14.5px; box-shadow: 0 1px 2px rgba(0,0,0,0.3); font-weight: 600; line-height: 1.5; position: relative; }
.bubble-right { background: #005c4b; color: #fff; padding: 14px; border-radius: 15px 0 15px 15px; max-width: 85%; align-self: flex-end; margin-left: auto; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); }

#cameraContainer { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; flex-direction: column; }
#previewCanvas { width: 100%; height: 75vh; object-fit: cover; display: none; }
img, video { border-radius: 12px; width: 100%; background: #000; border: 1px solid rgba(0,0,0,0.05); }
audio { filter: sepia(20%) saturate(70%) grayscale(1) contrast(90%) invert(100%); width: 100% !important; height: 35px; }
</style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

<header class="p-3 flex items-center justify-between bg-[#202c33] border-b border-white/5 sticky top-0 z-50">
    <button onclick="location.href='index.html'" class="text-slate-400 text-xl w-10 active:scale-90 transition-all">
        <i class="fas fa-arrow-left"></i>
    </button>

    <div class="flex-1 flex justify-center">
        <button id="chatBtn" class="bg-[#00a884] text-white px-4 py-1.5 rounded-full flex items-center gap-2 shadow-lg active:scale-95 transition-all">
            <i class="fab fa-whatsapp text-lg"></i>
            <span class="text-[10px] font-extrabold uppercase tracking-widest">Customer Chat</span>
        </button>
    </div>

    <div class="w-28 text-right overflow-hidden">
        <h2 id="custName" class="font-bold text-[10px] text-white uppercase truncate">Loading...</h2>
        <p id="custAddr" class="text-[8px] text-orange-400 font-bold truncate uppercase tracking-tighter">Please wait...</p>
    </div>
</header>

<div id="chatBody" class="flex-1 chat-bg p-5 flex flex-col overflow-y-auto pb-44">
    <div id="loader" class="flex flex-col items-center justify-center h-full opacity-30">
        <i class="fas fa-circle-notch animate-spin text-3xl mb-2"></i>
        <p class="text-[10px] font-bold uppercase tracking-widest">Accessing Supabase...</p>
    </div>
</div>

<div id="paymentBanner" class="hidden bg-gradient-to-r from-orange-600 to-orange-500 p-3 text-center shadow-2xl fixed bottom-[88px] w-[92%] left-[4%] rounded-2xl z-30 border border-white/20">
    <p class="text-[10px] font-black uppercase text-white/80 tracking-widest">Collect Total Cash</p>
    <p id="cashAmount" class="text-2xl font-extrabold text-white">Rs. 0</p>
</div>

<div id="actionArea" class="p-4 bg-[#111b21] border-t border-white/10 fixed bottom-0 w-full z-40">
    <button class="w-full bg-slate-800 py-4 rounded-2xl font-black uppercase text-xs text-white/50" disabled>Initializing Status...</button>
</div>

<div id="cameraContainer">
    <video id="v" class="w-full h-[75vh] object-cover" autoplay playsinline muted></video>
    <canvas id="previewCanvas"></canvas>
    <div id="cameraControls" class="flex-1 bg-black flex items-center justify-around pb-8 px-6">
        <button onclick="stopCamera()" class="text-white/40 uppercase text-[10px] font-black w-20">Cancel</button>
        <button onclick="freezeFrame()" class="w-20 h-20 bg-white rounded-full border-8 border-slate-800 shadow-2xl active:scale-90 transition-all"></button>
        <div class="w-20"></div>
    </div>
    <div id="confirmControls" class="hidden flex-1 bg-black flex items-center justify-around pb-8 px-6">
        <button onclick="retakePhoto()" class="bg-red-500/10 text-red-500 px-6 py-3 rounded-2xl uppercase text-[10px] font-black border border-red-500/20">Retake</button>
        <button id="confirmBillBtn" onclick="uploadConfirmedPhoto()" class="bg-green-600 text-white px-8 py-4 rounded-2xl uppercase text-xs font-black shadow-xl active:scale-95 transition-all">Confirm & Bill</button>
    </div>
    <canvas id="c" class="hidden"></canvas>
</div>

<div id="customModal" class="hidden fixed inset-0 bg-black/60 z-[9999] flex items-center justify-center backdrop-blur-md p-4 transition-opacity duration-300">
    <div class="w-full max-w-sm rounded-[2rem] p-6 border border-white/20 shadow-[0_8px_32px_0_rgba(0,0,0,0.5)] text-center relative overflow-hidden" style="background: rgba(30, 41, 59, 0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);">
        <div class="absolute -top-10 -left-10 w-32 h-32 bg-orange-500/30 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-teal-500/20 rounded-full blur-3xl"></div>
        
        <h3 id="modalTitle" class="text-white font-black text-[13px] mb-5 uppercase tracking-widest relative z-10 leading-relaxed">Message</h3>
        
        <input type="number" id="modalInput" class="hidden w-full bg-black/30 border border-white/10 rounded-2xl p-4 text-white text-center font-extrabold text-3xl mb-6 outline-none focus:border-orange-500/50 shadow-inner relative z-10" placeholder="0">
        
        <div class="flex gap-3 relative z-10">
            <button id="modalCancel" class="hidden flex-1 py-4 rounded-2xl font-bold text-white/60 bg-white/5 active:bg-white/10 border border-white/5 transition-all uppercase text-[10px] tracking-widest">Cancel</button>
            <button id="modalOk" class="flex-1 py-4 rounded-2xl font-black text-white bg-gradient-to-r from-orange-500 to-orange-600 shadow-xl active:scale-95 border border-orange-400/50 transition-all uppercase text-[10px] tracking-widest">Confirm</button>
        </div>
    </div>
</div>

<script>
function customAlert(message) {
    return new Promise((resolve) => {
        const modal = document.getElementById('customModal');
        document.getElementById('modalTitle').innerText = message;
        document.getElementById('modalInput').classList.add('hidden');
        document.getElementById('modalCancel').classList.add('hidden');
        
        modal.classList.remove('hidden');
        
        document.getElementById('modalOk').onclick = () => {
            modal.classList.add('hidden');
            resolve(true);
        };
    });
}

function customPrompt(message, defaultValue = "") {
    return new Promise((resolve) => {
        const modal = document.getElementById('customModal');
        const input = document.getElementById('modalInput');
        const cancelBtn = document.getElementById('modalCancel');
        
        document.getElementById('modalTitle').innerText = message;
        input.value = defaultValue;
        input.classList.remove('hidden');
        cancelBtn.classList.remove('hidden');
        
        modal.classList.remove('hidden');
        setTimeout(() => input.focus(), 100);
        
        document.getElementById('modalOk').onclick = () => {
            if(input.value.trim() === "") return; 
            modal.classList.add('hidden');
            resolve(input.value);
        };
        
        cancelBtn.onclick = () => {
            modal.classList.add('hidden');
            resolve(null);
        };
    });
}

const SB_URL = "https://hkabhikizdlbavfkualt.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U";
const _supabase = supabase.createClient(SB_URL, SB_KEY);

const params = new URLSearchParams(window.location.search);
const orderId = params.get('id');
let stream = null, finalBlob = null, currentOrderData = null;

if(orderId) {
    document.getElementById('chatBtn').onclick = () => location.href = 'customer-chat.html?id=' + orderId;
}

async function fetchOrderDetails() {
    if(!orderId) {
        document.getElementById('chatBody').innerHTML = "<div class='p-10 text-center opacity-50'>ORDER ID MISSING</div>";
        return;
    }
    try {
        const { data: o, error } = await _supabase.from('orders').select('*').eq('id', orderId).maybeSingle();
        if (error) throw error;
        if (!o) throw "Order not found";
        
        currentOrderData = o;
        document.getElementById('custName').innerText = o.customer_name || "Customer";
        document.getElementById('custAddr').innerText = o.delivery_address || "No Address";
        
        let chatHtml = '';
        const parseMedia = (val) => (val && typeof val === 'string') ? val.split(',').map(s => s.trim()) : [];

        const allTextLines = String(o.order_details || '').split(/[|\n]/).map(line => line.trim()).filter(l => l !== "");
        const images = parseMedia(o.image_url);
        const videos = parseMedia(o.video_url);
        const voices = parseMedia(o.voice_url);

        const mainOrderLines = allTextLines.filter(l => !l.toLowerCase().includes("photo caption:"));
        const photoCaptions = allTextLines.filter(l => l.toLowerCase().includes("photo caption:"));

        mainOrderLines.forEach(item => {
            chatHtml += `<div class="bubble-left"><i class="fas fa-shopping-basket mr-2 opacity-30 text-[10px]"></i>${item}</div>`;
        });

        images.forEach((img, index) => {
            let cap = photoCaptions[index] ? photoCaptions[index].replace(/photo caption:/i, '').trim() : "";
            chatHtml += `<div class="bubble-left p-1 w-64 mb-4">
                <img src="${img}" class="h-64 w-full object-cover rounded-lg shadow-sm mb-1" onclick="window.open('${img}')">
                ${cap ? `<p class="px-2 py-1 text-[13px] border-t border-black/5 mt-1 text-black font-semibold">${cap}</p>` : ''}
            </div>`;
        });

        videos.forEach(vid => {
            if(vid) chatHtml += `<div class="bubble-left p-1 w-64 mb-3"><video controls playsinline preload="metadata" src="${vid}"></video></div>`;
        });

        voices.forEach(voice => {
            if(voice) chatHtml += `<div class="bubble-left bg-[#dcf8c6] w-64 flex items-center gap-2 mb-3"><i class="fas fa-microphone text-blue-500"></i><audio controls class="w-full h-8" src="${voice}"></audio></div>`;
        });

        if(o.bill_amount){
            chatHtml += `<div class="bubble-right">
                <p class="text-[9px] opacity-60 font-black mb-1 uppercase">Bill Summary</p>
                ${o.bill_image ? `<img src="${o.bill_image}" class="h-32 mb-2 object-cover rounded-lg shadow-inner">` : ''}
                <div class="text-[11px] space-y-1">
                    <div class="flex justify-between"><span>Shop+DC:</span><span>Rs. ${parseFloat(o.item_price||0) + parseFloat(o.dc_amount||0)}</span></div>
                    <div class="flex justify-between font-bold text-orange-200"><span>Old Balance:</span><span>Rs. ${o.previous_due || 0}</span></div>
                </div>
                <div class="mt-2 pt-2 border-t border-white/20 text-center font-black text-white text-lg">Rs. ${o.bill_amount}</div>
            </div>`;
            document.getElementById('paymentBanner').classList.remove('hidden');
            document.getElementById('cashAmount').innerText = `Rs. ${o.bill_amount}`;
        }

        document.getElementById('chatBody').innerHTML = chatHtml || "<div class='text-center p-10 opacity-20'>No details found.</div>";
        document.getElementById('chatBody').scrollTop = document.getElementById('chatBody').scrollHeight;
        renderButtons(o);

    } catch (e) {
        document.getElementById('chatBody').innerHTML = `<div class='p-10 text-center text-red-500 font-bold'>ERROR: ${e.message || e}</div>`;
    }
}

function renderButtons(o){
    const area = document.getElementById('actionArea');
    if(!o.bill_amount) {
        area.innerHTML = `<button onclick="startCamera()" class="w-full bg-blue-600 py-4 rounded-2xl font-black uppercase text-xs text-white shadow-xl active:scale-95 transition-all">Step 1: Take Bill Photo</button>`;
    } else if(o.rider_status !== 'Arrived') {
        area.innerHTML = `<button onclick="updateRiderStatus('Arrived')" class="w-full bg-purple-600 py-4 rounded-2xl font-black uppercase text-xs text-white shadow-xl active:scale-95 transition-all">Step 2: I Have Arrived</button>`;
    } else {
        area.innerHTML = `<button onclick="finishOrderAction()" class="w-full bg-green-600 py-4 rounded-2xl font-black uppercase text-xs text-white shadow-xl active:scale-95 transition-all">Step 3: Order Delivered</button>`;
    }
}

async function startCamera(){ 
    document.getElementById('cameraContainer').style.display='flex'; 
    retakePhoto();
    try {
        stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}); 
        document.getElementById('v').srcObject = stream; 
    } catch(e) { 
        await customAlert("Camera Error: " + e.message); 
        stopCamera(); 
    }
}

function stopCamera(){ if(stream) stream.getTracks().forEach(t=>t.stop()); document.getElementById('cameraContainer').style.display='none'; }

async function freezeFrame(){
    const v = document.getElementById('v'), c = document.getElementById('c'), p = document.getElementById('previewCanvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v,0,0);
    finalBlob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.75));
    v.style.display='none'; p.style.display='block';
    p.width = c.width; p.height = c.height;
    p.getContext('2d').drawImage(c,0,0);
    document.getElementById('cameraControls').classList.add('hidden'); document.getElementById('confirmControls').classList.remove('hidden');
}

function retakePhoto(){ 
    document.getElementById('v').style.display='block'; 
    document.getElementById('previewCanvas').style.display='none'; 
    document.getElementById('cameraControls').classList.remove('hidden'); 
    document.getElementById('confirmControls').classList.add('hidden'); 
}

async function uploadConfirmedPhoto(){
    const input = await customPrompt("Dukan ka bill (Sirf Saman ki price) likhen:");
    if(input === null || isNaN(input) || input.trim() === "") return;
    
    const btn = document.getElementById('confirmBillBtn');
    btn.disabled=true; btn.innerText="UPDATING...";
    
    try {
        // 1. Fetch Wallet Balance
        const { data: wal, error: walErr } = await _supabase.from('wallets')
            .select('current_balance')
            .eq('customer_phone', currentOrderData.customer_phone) 
            .maybeSingle();
        
        if (walErr) console.error("Wallet Fetch Error:", walErr.message);
        
        // 🔥 NAYI HYBRID LOGIC: Pehle order se dc_amount uthayen
        let dc = parseFloat(currentOrderData.dc_amount || 0);
        
        // Agar Order mein DC 0 hai, toh realtime database se uthayen
        if (dc === 0) {
            // Step A: Customer ka City aur Area mangwayen
            const { data: custData } = await _supabase.from('customers')
                .select('city, area')
                .eq('phone', currentOrderData.customer_phone)
                .single();
            
            if (custData && custData.city && custData.area) {
                // Step B: Us City/Area ki exact Delivery Fee (customer_delivery_fee) uthayen
                const { data: areaData } = await _supabase.from('delivery_areas')
                    .select('customer_delivery_fee')
                    .eq('city', custData.city)
                    .eq('area_name', custData.area)
                    .single();
                    
                if (areaData && areaData.customer_delivery_fee) {
                    dc = parseFloat(areaData.customer_delivery_fee);
                    console.log("Realtime Area Fee Applied: Rs.", dc);
                }
            }
        }
        
        const prev = wal ? parseFloat(wal.current_balance || 0) : 0; 
        const shopBill = parseFloat(input);
        
        // Final Total Calculation (Ab DC kabhi zero nahi hoga agar area mein fee hai toh)
        const finalTotal = shopBill + dc + prev;

        const path = `bill_${Date.now()}.jpg`;
        
        const { data: uploadData, error: uploadErr } = await _supabase.storage.from('order-files').upload(path, finalBlob);
        
        if (uploadErr) {
            throw new Error("Image Upload Fail Ho Gayi: " + uploadErr.message);
        }

        const url = `${SB_URL}/storage/v1/object/public/order-files/${path}`;

        const { error: updateErr } = await _supabase.from('orders').update({
            item_price: shopBill, 
            dc_amount: dc, // Yeh updated/hybrid DC wapas database mein fix ho jayega
            previous_due: prev,
            bill_amount: finalTotal, 
            bill_image: url, 
            rider_status: 'Bill Uploaded'
        }).eq('id', orderId);

        if (updateErr) {
            throw new Error("Order Update Fail: " + updateErr.message);
        }

        stopCamera(); 
        window.location.reload();
        
    } catch(err) { 
        await customAlert("❌ Error: " + err.message); 
        btn.disabled=false; 
        btn.innerText="Confirm & Bill"; 
    }
}

async function updateRiderStatus(s){ 
    await _supabase.from('orders').update({ rider_status: s, status: 'arrived', arrived_at: new Date().toISOString() }).eq('id', orderId); 
    window.location.reload(); 
}

// --- NEW 100% BULLETPROOF FINISH ORDER LOGIC WITH DUAL WALLET SYNC ---
async function finishOrderAction() {
    const cash = await customPrompt(`Enter Received Amount`, currentOrderData.bill_amount);
    if(cash === null || cash.trim() === "") return;
    
    const paid = parseFloat(cash);
    const bal = parseFloat(currentOrderData.bill_amount) - paid;

    try {
        // 1. Fetch Fixed Fees
        const { data: settings, error: setErr } = await _supabase
            .from('app_settings')
            .select('customer_delivery_fee, rider_commission')
            .eq('id', 1).single();
            
        if (setErr) throw new Error("Settings fetch fail: " + setErr.message);

        const riderCut = parseFloat(settings.rider_commission || 0);

        // 🔥 NAYA FORMULA: Asal Hisaab (Cash in Hand)
        const itemPrice = parseFloat(currentOrderData.item_price || 0);
        const riderTotalHaqq = itemPrice + riderCut; // Rider ka apna paisa (Saman + Commission)
        const netOwedToOffice = paid - riderTotalHaqq; // Total Cash minus Rider Ka Paisa = Office ko dene wale paise

        // 2. Sync RIDER'S WALLET
        const rPhone = currentOrderData.rider_phone;
        if(!rPhone) throw new Error("Rider Phone Missing");

        let { data: rWallet, error: rWalErr } = await _supabase
            .from('rider_wallets')
            .select('balance')
            .eq('rider_phone', rPhone)
            .maybeSingle();

        let currentRiderBalance = 0;
        if (rWallet) { currentRiderBalance = parseFloat(rWallet.balance || 0); }
        
        // Puraana hisaab + Naya hisaab
        const newRiderBalance = currentRiderBalance + netOwedToOffice;

        if (rWallet) {
            const { error: rwUpdateErr } = await _supabase.from('rider_wallets').update({ balance: newRiderBalance, updated_at: new Date().toISOString() }).eq('rider_phone', rPhone);
            if (rwUpdateErr) throw new Error("Rider Wallet Update Fail");
        } else {
            const { error: rwInsertErr } = await _supabase.from('rider_wallets').insert([{ rider_phone: rPhone, balance: newRiderBalance, updated_at: new Date().toISOString() }]);
            if (rwInsertErr) throw new Error("Rider Wallet Create Fail");
        }

        // 3. Mark Order Completed
        const { error: orderErr } = await _supabase.from('orders').update({ 
            status: 'completed', 
            rider_status: 'Delivered', 
            final_amount: paid, 
            balance_amount: bal, 
            updated_at: new Date().toISOString() 
        }).eq('id', orderId);

        if (orderErr) throw new Error("Orders Table Error: " + orderErr.message);

        // 4. Sync CUSTOMER'S WALLET
        const { data: existingWallet, error: fetchErr } = await _supabase
            .from('wallets')
            .select('id')
            .eq('customer_phone', currentOrderData.customer_phone)
            .maybeSingle();

        if (fetchErr) throw new Error("Wallets Check Error: " + fetchErr.message);

        if (existingWallet) {
            const { error: updateErr } = await _supabase.from('wallets').update({ 
                current_balance: bal, 
                updated_at: new Date().toISOString() 
            }).eq('customer_phone', currentOrderData.customer_phone);
            
            if (updateErr) throw new Error("Customer Wallet Update Error: " + updateErr.message);
        } else {
            const { error: insertErr } = await _supabase.from('wallets').insert([{ 
                customer_phone: currentOrderData.customer_phone,
                current_balance: bal, 
                updated_at: new Date().toISOString() 
            }]);
            
            if (insertErr) throw new Error("Customer Wallet Insert Error: " + insertErr.message);
        }

        // 5. Update Customer Database Profile
        await _supabase.from('customers').update({ wallet_balance: bal }).eq('phone', currentOrderData.customer_phone);

        // All Synced
        await customAlert("✅ Order Delivered Successfully & All Wallets Synced!");
        location.href = 'index.html';

    } catch (err) {
        await customAlert("❌ Error during financial sync: " + err.message);
    }
}


// . Phir sirf is specific order ke liye Supabase Realtime active kar dein
if (orderId) { 
        fetchOrderDetails();
    _supabase.channel(`live-order-${orderId}`)
        .on('postgres_changes', { 
            event: 'UPDATE', // Jab bhi database me data update ho
            schema: 'public', 
            table: 'orders',
            filter: `id=eq.${orderId}` // Sirf isi order ka data check kare
        }, (payload) => {
            console.log("Database updated in realtime!", payload.new);
            fetchOrderDetails(); // Sirf tabhi screen update hogi jab sach me koi change aayega
        })
        .subscribe();
}
</script>
