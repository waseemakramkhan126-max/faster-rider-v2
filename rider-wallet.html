<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faster Rider - Financial Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .rider-card { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); transition: 0.3s; }
        .last-order-box { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        .animate-pop { animation: pop 0.3s ease-out; }
        @keyframes pop { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-white p-4 flex items-center shadow-sm sticky top-0 z-50">
        <i class="fas fa-arrow-left text-xl mr-4 cursor-pointer text-gray-600" onclick="history.back()"></i>
        <h1 class="font-extrabold text-lg text-gray-800">Financial Ledger</h1>
    </header>

    <main class="flex-1 p-5 max-w-md mx-auto w-full">
        <div id="balanceCard" class="rider-card rounded-[2.5rem] p-8 text-white shadow-2xl mb-6 relative overflow-hidden">
            <div class="relative z-10">
                <p id="balanceLabel" class="text-[10px] opacity-60 uppercase tracking-[0.2em] font-black mb-1">Net Office Balance</p>
                <h2 id="balanceAmount" class="text-5xl font-extrabold mb-4 tracking-tighter">Rs. 0</h2>
                <div id="statusBadge" class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest bg-white/10 border border-white/20 text-white/80">
                    Syncing Ledger...
                </div>
            </div>
            <i class="fas fa-file-invoice-dollar absolute -right-8 -bottom-8 text-white/5 text-[10rem] -rotate-12"></i>
        </div>

        <div id="lastOrderSection" class="hidden animate-pop mb-8">
            <h3 class="font-black text-gray-400 uppercase text-[9px] tracking-[0.2em] mb-3 ml-2">Last Order Activity</h3>
            <div id="lastOrderDetails" class="last-order-box p-6">
                </div>
        </div>

        <div class="flex items-center justify-between mb-4 px-2">
            <h3 class="font-black text-gray-800 uppercase text-[10px] tracking-widest">Unsettled Orders List</h3>
            <span class="text-[9px] bg-gray-200 text-gray-500 px-2 py-0.5 rounded-md font-bold uppercase">History</span>
        </div>

        <div id="transactionList" class="space-y-4 pb-10">
            <div class="flex justify-center py-10">
                <i class="fas fa-circle-notch animate-spin text-3xl text-slate-900"></i>
            </div>
        </div>
    </main>

    <script>
        const SB_URL = "https://hkabhikizdlbavfkualt.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYWJoaWtpemRsYmF2Zmt1YWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODgyMjUsImV4cCI6MjA5MjA2NDIyNX0.iMlS6-M1aylW8K915LPYDHOg7qUxwu5GelH_CPHLP2U";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        const riderPhone = (localStorage.getItem('rider_phone') || "").trim();

        async function initWallet() {
            if (!riderPhone) return;
            fetchLedger();
            _supabase.channel('wallet-updates').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, fetchLedger).subscribe();
        }

        async function fetchLedger() {
            try {
                const { data: settings } = await _supabase.from('app_settings').select('rider_commission').eq('id', 1).single();
                const riderCommConstant = parseFloat(settings?.rider_commission || 0);

                const { data: orders, error } = await _supabase
                    .from('orders')
                    .select('*')
                    .eq('rider_phone', riderPhone)
                    .eq('status', 'completed')
                    .order('updated_at', { ascending: false }); // Latest first

                if (error) throw error;

                if (orders.length === 0) {
                    document.getElementById('transactionList').innerHTML = `<div class="text-center py-10 opacity-40"><p class="text-xs font-bold uppercase">No orders found</p></div>`;
                    updateUI(0);
                    return;
                }

                // 1. Logic for Last Order Details (Green Card ke neeche wala box)
                const last = orders[0];
                const lastItemPlusDc = parseFloat(last.item_price || 0) + parseFloat(last.dc_amount || 0);
                const lastPending = parseFloat(last.balance_amount || 0);
                
                document.getElementById('lastOrderSection').classList.remove('hidden');
                document.getElementById('lastOrderDetails').innerHTML = `
                    <div class="flex justify-between items-start mb-4 border-b border-gray-50 pb-3">
                        <div>
                            <p class="text-[10px] font-black text-blue-600 uppercase tracking-tighter">Order ID: #${last.id.toString().slice(-6)}</p>
                            <h4 class="text-lg font-black text-gray-800 leading-tight">${last.customer_name}</h4>
                        </div>
                        <div class="text-right">
                            <p class="text-[9px] text-gray-400 font-bold uppercase">${new Date(last.updated_at).toLocaleDateString()}</p>
                            <p class="text-[9px] text-gray-400 font-bold uppercase">${new Date(last.updated_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <div class="flex items-start gap-3 bg-gray-50 p-3 rounded-2xl border border-gray-100 mb-4">
                            <i class="fas fa-map-marker-alt text-red-500 mt-1"></i>
                            <p class="text-[11px] font-bold text-gray-600 leading-relaxed">${last.delivery_address || 'N/A'}</p>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-blue-50/50 p-3 rounded-2xl border border-blue-100">
                                <p class="text-[9px] font-black text-blue-400 uppercase mb-1">Item + DC</p>
                                <p class="text-sm font-black text-gray-800">Rs. ${lastItemPlusDc}</p>
                            </div>
                            <div class="bg-emerald-50/50 p-3 rounded-2xl border border-emerald-100">
                                <p class="text-[9px] font-black text-emerald-500 uppercase mb-1">Received Cash</p>
                                <p class="text-sm font-black text-emerald-700">Rs. ${last.final_amount || 0}</p>
                            </div>
                        </div>

                        <div class="flex justify-between items-center bg-slate-900 text-white p-4 rounded-2xl shadow-lg mt-2">
                             <div>
                                <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest">Customer Pending</p>
                                <p class="text-lg font-black ${lastPending > 0 ? 'text-red-400' : 'text-emerald-400'}">Rs. ${Math.abs(lastPending)}</p>
                             </div>
                             <div class="h-8 w-[1px] bg-white/10"></div>
                             <div class="text-right">
                                <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest">Status</p>
                                <p class="text-xs font-black uppercase text-orange-400">Delivered</p>
                             </div>
                        </div>
                    </div>
                `;

                // 2. Logic for Financial Ledger (All Unsettled)
                let finalNetForOffice = 0;
                let listHtml = "";
                const unsettledOrders = orders.filter(o => o.is_settled === false);

                for (const o of unsettledOrders) {
                    const itemPrice = parseFloat(o.item_price || 0);
                    const dc = parseFloat(o.dc_amount || 0);
                    const collected = parseFloat(o.final_amount || 0);
                    
                    const riderTotalHaqq = itemPrice + riderCommConstant;
                    const netToOffice = collected - riderTotalHaqq;
                    finalNetForOffice += netToOffice;

                    listHtml += `
                        <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-2xl flex items-center justify-center ${netToOffice >= 0 ? 'bg-red-50 text-red-500' : 'bg-green-50 text-green-500'}">
                                    <i class="fas ${netToOffice >= 0 ? 'fa-arrow-up' : 'fa-arrow-down'} text-xs"></i>
                                </div>
                                <div>
                                    <h4 class="text-[11px] font-black text-gray-800 uppercase">Order #${o.id.toString().slice(-5)}</h4>
                                    <p class="text-[9px] text-gray-400 font-bold">${o.customer_name}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-sm font-black ${netToOffice >= 0 ? 'text-red-600' : 'text-green-600'}">Rs. ${Math.abs(netToOffice)}</p>
                                <p class="text-[8px] font-black text-gray-300 uppercase">${netToOffice >= 0 ? 'Pay Office' : 'Collect'}</p>
                            </div>
                        </div>
                    `;
                }

                document.getElementById('transactionList').innerHTML = listHtml || `<p class="text-center py-10 text-[10px] font-bold text-gray-400 uppercase">No pending settlements</p>`;
                updateUI(finalNetForOffice);

            } catch (err) { console.error("Ledger Error:", err); }
        }

        function updateUI(balance) {
            const amtEl = document.getElementById('balanceAmount');
            const badge = document.getElementById('statusBadge');
            const label = document.getElementById('balanceLabel');
            const card = document.getElementById('balanceCard');
            amtEl.innerText = `Rs. ${Math.abs(balance).toLocaleString()}`;
            if (balance > 0) {
                badge.innerText = "Cash in Hand (Office Debt)";
                label.innerText = "Submit to Office";
                card.style.background = "linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%)";
            } else if (balance < 0) {
                badge.innerText = "Office owes you money";
                label.innerText = "Collect from Office";
                card.style.background = "linear-gradient(135deg, #065f46 0%, #064e3b 100%)";
            } else {
                badge.innerText = "All Settlements Clear";
                label.innerText = "Net Balance";
                card.style.background = "linear-gradient(135deg, #0f172a 0%, #334155 100%)";
            }
        }
        window.onload = initWallet;
    </script>
</body>
</html>
